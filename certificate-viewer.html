<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Certificate Viewer - Hassan Portfolio
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            min-height: 100vh;
            background: #0b0f19;
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .viewer-header {
            width: 100%;

            padding:
                18px 25px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            background:
                rgba(15, 23, 42, 0.96);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.1);

            position: sticky;

            top: 0;

            z-index: 1000;

            backdrop-filter:
                blur(10px);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .viewer-title {
            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .viewer-title i {
            font-size: 22px;
            color: #00d9ff;

            flex-shrink: 0;
        }

        .viewer-title span {
            font-size: 18px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {
            text-decoration: none;

            color: #ffffff;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            padding:
                9px 16px;

            border-radius: 8px;

            transition:
                0.25s ease;

            white-space: nowrap;

            flex-shrink: 0;
        }

        .back-button:hover {
            background:
                rgba(255, 255, 255, 0.15);
        }


        /* =====================================================
           VIEWER CONTAINER
        ===================================================== */

        .viewer-container {
            width: 100%;

            max-width: 1200px;

            margin:
                30px auto;

            padding:
                0 20px 40px;
        }


        /* =====================================================
           CERTIFICATE PAGES CONTAINER
        ===================================================== */

        #certificatePages {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 30px;
        }


        /* =====================================================
           PAGE WRAPPER
        ===================================================== */

        .certificate-page-wrapper {
            position: relative;

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: visible;
        }


        /* =====================================================
           CERTIFICATE CANVAS
        ===================================================== */

        .certificate-page {
            display: block;

            max-width: 100%;

            width: auto;

            height: auto;

            background: #ffffff;

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.45);

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;

            pointer-events: none;
        }


        /* =====================================================
           PROTECTION LAYER
        ===================================================== */

        .certificate-protection-layer {
            position: absolute;

            inset: 0;

            z-index: 10;

            background: transparent;

            user-select: none;

            -webkit-user-select: none;

            -webkit-touch-callout: none;

            cursor: default;
        }


        /* =====================================================
           LOADING / ERROR STATUS
        ===================================================== */

        .status {
            min-height: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            text-align: center;

            padding:
                30px 20px;
        }

        .status i {
            font-size: 35px;

            color: #00d9ff;
        }

        .status h2 {
            font-size: 20px;
        }

        .status p {
            color:
                rgba(255, 255, 255, 0.65);

            max-width: 600px;

            line-height: 1.6;
        }


        /* =====================================================
           PAGE LOADING INDICATOR
        ===================================================== */

        .page-loading {
            width: 100%;

            min-height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 12px;

            color:
                rgba(255, 255, 255, 0.75);
        }

        .page-loading i {
            color: #00d9ff;

            font-size: 25px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .viewer-header {
                padding:
                    14px;
            }

            .viewer-title {
                gap: 8px;
            }

            .viewer-title i {
                font-size: 18px;
            }

            .viewer-title span {
                font-size: 14px;
            }

            .back-button {
                padding:
                    8px 11px;

                font-size:
                    13px;
            }

            .viewer-container {
                padding:
                    0 8px 30px;

                margin-top:
                    15px;
            }

            #certificatePages {
                gap: 20px;
            }

            .certificate-page-wrapper {
                width: 100%;
            }

            .status {
                min-height: 250px;
            }

            .status h2 {
                font-size: 18px;
            }

            .status p {
                font-size: 14px;
            }

        }


        /* =====================================================
           VERY SMALL SCREENS
        ===================================================== */

        @media (max-width: 400px) {

            .viewer-title span {
                display: none;
            }

            .back-button {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="viewer-header">

        <div class="viewer-title">

            <i class="fa-solid fa-certificate"></i>

            <span>
                Certificate Viewer
            </span>

        </div>


        <a
            href="certificates.html"
            class="back-button"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back

        </a>

    </header>


    <!-- =====================================================
         CERTIFICATE VIEWER
    ====================================================== -->

    <main class="viewer-container">


        <!-- LOADING / ERROR STATUS -->

        <div
            id="status"
            class="status"
        >

            <i
                class="fa-solid fa-spinner fa-spin"
            ></i>

            <h2>
                Loading certificate...
            </h2>

            <p>
                Please wait while the certificate is loaded.
            </p>

        </div>


        <!-- PDF PAGES -->

        <div
            id="certificatePages"
        ></div>


    </main>


    <!-- =====================================================
         CERTIFICATE VIEWER SCRIPT
    ====================================================== -->

    <script
        type="module"
        src="certificate-viewer.js"
    ></script>


    <!-- =====================================================
         BASIC PROTECTION
    ====================================================== -->

    <script>

        document.addEventListener(
            "contextmenu",
            function(event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "dragstart",
            function(event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "selectstart",
            function(event) {

                event.preventDefault();

            }
        );

    </script>


</body>

</html>
