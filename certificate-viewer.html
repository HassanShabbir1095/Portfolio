<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>
        Certificate - Hassan Portfolio
    </title>


    <style>

        /* =====================================================
           CERTIFICATE VIEWER
        ====================================================== */

        .certificate-viewer {

            width: 100%;

            min-height: calc(100vh - 80px);

            padding: 30px;

            display: flex;

            flex-direction: column;

            align-items: center;

            box-sizing: border-box;

        }


        .certificate-viewer-header {

            width: 100%;

            max-width: 1200px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .certificate-viewer-title {

            margin: 0;

            font-size: 28px;

        }


        .certificate-viewer-title span {

            color: #b74b4b;

        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            border: 1px solid #b74b4b;

            color: #b74b4b;

            transition: 0.3s ease;

        }


        .back-button:hover {

            background: #b74b4b;

            color: white;

        }


        .certificate-frame-container {

            width: 100%;

            max-width: 1200px;

            height: calc(100vh - 180px);

            min-height: 600px;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 0 25px rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            background: #222;

        }


        .certificate-frame {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        .certificate-loading {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            color: white;

            text-align: center;

        }


        .certificate-error {

            display: none;

            text-align: center;

            padding: 40px;

        }


        .certificate-error i {

            font-size: 50px;

            margin-bottom: 20px;

            color: #b74b4b;

        }


        @media (max-width: 768px) {

            .certificate-viewer {

                padding: 15px;

            }


            .certificate-viewer-header {

                flex-direction: column;

                gap: 15px;

                align-items: flex-start;

            }


            .certificate-frame-container {

                height:
                    calc(
                        100vh - 220px
                    );

                min-height: 500px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <a
            href="index.html"
            class="logo"
        >

            Hassan

        </a>


        <div class="hamburger">

            <i class="fas fa-bars"></i>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="skills.html">
                Skills
            </a>

            <a href="projects.html">
                Projects
            </a>

            <a href="education.html">
                Education
            </a>

            <a
                href="certificates.html"
                class="active"
            >
                Certificates
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- =====================================================
         CERTIFICATE VIEWER
    ====================================================== -->

    <main class="certificate-viewer">


        <div class="certificate-viewer-header">

            <h1 class="certificate-viewer-title">

                Certificate <span>Viewer</span>

            </h1>


            <a
                href="certificates.html"
                class="back-button"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Certificates

            </a>

        </div>


        <!-- =================================================
             PDF
        ================================================== -->

        <div
            id="certificateFrameContainer"
            class="certificate-frame-container"
        >

            <iframe
                id="certificateFrame"
                class="certificate-frame"
                title="Certificate PDF"
                loading="eager"
            ></iframe>

        </div>


        <!-- =================================================
             ERROR
        ================================================== -->

        <div
            id="certificateError"
            class="certificate-error"
        >

            <i
                class="fa-solid fa-triangle-exclamation"
            ></i>

            <h2>
                Certificate Could Not Be Loaded
            </h2>

            <p>
                The certificate file could not be displayed.
            </p>

        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


    <script>

        // ====================================================
        // CLOUDFLARE WORKER
        // ====================================================

        const WORKER_URL =
            "https://hassan-portfolio-worker.hassanshabbir1095.workers.dev";


        // ====================================================
        // GET PATH FROM URL
        // ====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const certificatePath =
            params.get(
                "path"
            );


        // ====================================================
        // ELEMENTS
        // ====================================================

        const frame =
            document.getElementById(
                "certificateFrame"
            );


        const frameContainer =
            document.getElementById(
                "certificateFrameContainer"
            );


        const errorMessage =
            document.getElementById(
                "certificateError"
            );


        // ====================================================
        // VALIDATE PATH
        // ====================================================

        if (
            !certificatePath ||
            !certificatePath.startsWith(
                "certificates/"
            ) ||
            !certificatePath
                .toLowerCase()
                .endsWith(".pdf")
        ) {

            frameContainer.style.display =
                "none";


            errorMessage.style.display =
                "block";

        } else {


            // =================================================
            // CREATE WORKER PDF URL
            // =================================================

            const pdfURL =
                `${WORKER_URL}/certificate?path=` +
                `${encodeURIComponent(
                    certificatePath
                )}`;


            // =================================================
            // DISPLAY PDF
            // =================================================

            frame.src =
                pdfURL;

        }

    </script>


</body>

</html>
